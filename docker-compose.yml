name: f1racehub
version: "3.8"

services:
  # F1 Proxy - connects to F1 Live Timing
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: f1-prod-api
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-4000}:4000"
    environment:
      - PORT=4000
      - PROXY_MODE=${PROXY_MODE:-auto}
      - OPENF1_USERNAME=${OPENF1_USERNAME}
      - OPENF1_PASSWORD=${OPENF1_PASSWORD}
      - REPLAY_SESSION_KEY=${REPLAY_SESSION_KEY}
      - NODE_ENV=${NODE_ENV:-production}
      - F1_LIVETIMING_TOKEN=${F1_LIVETIMING_TOKEN}
      - DB_PATH=/app/data/f1-sessions.db
    volumes:
      - proxy-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - apps

  # Next.js Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Empty by default: the browser then uses the same-origin /api/proxy
        # Next.js rewrite (→ INTERNAL_PROXY_URL) instead of hitting the proxy
        # directly. Only set this to a PUBLIC https URL if you intentionally
        # expose the proxy. NEVER let it bake to localhost.
        - NEXT_PUBLIC_PROXY_URL=${NEXT_PUBLIC_PROXY_URL:-}
        # INTERNAL_PROXY_URL must be a build arg (not just runtime env) because
        # Next.js compiles rewrites into routes-manifest.json during next build.
        - INTERNAL_PROXY_URL=http://f1-prod-api:4000
    container_name: f1-prod-ui
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - INTERNAL_PROXY_URL=http://f1-prod-api:4000
      # Contact form (see .env.example)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - CONTACT_TO_EMAIL=${CONTACT_TO_EMAIL:-}
      - CONTACT_FROM_EMAIL=${CONTACT_FROM_EMAIL:-}
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      - apps

networks:
  apps:
    external: true

volumes:
  # SQLite session archive — survives container rebuilds
  proxy-data:
