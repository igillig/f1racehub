name: Deploy f1-stats (dev)

on:
  push:
    branches: [ release/dev ]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from secrets
        run: |
          echo "NODE_ENV=development" > .env
          echo "PROXY_MODE=${{ vars.PROXY_MODE }}" >> .env
          echo "OPENF1_USERNAME=${{ secrets.OPENF1_USERNAME }}" >> .env
          echo "OPENF1_PASSWORD=${{ secrets.OPENF1_PASSWORD }}" >> .env
          echo "REPLAY_SESSION_KEY=${{ vars.REPLAY_SESSION_KEY }}" >> .env
          echo "F1_LIVETIMING_TOKEN=${{ secrets.F1_LIVETIMING_TOKEN }}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "NEXT_PUBLIC_SITE_URL=https://dev.f1racehub.com" >> .env
          echo "DASHBOARD_PORT=3001" >> .env
          echo "PROXY_PORT=4001" >> .env

      - name: Ensure docker network exists
        run: docker network create apps || true

      - name: Build and deploy (dev stack)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml build
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --remove-orphans
          docker image prune -f
