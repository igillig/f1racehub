name: Deploy f1-stats

on:
  push:
    branches: [ release/production ]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from secrets
        run: |
          echo "NODE_ENV=${{ vars.NODE_ENV }}" > .env
          echo "PROXY_MODE=${{ vars.PROXY_MODE }}" >> .env
          echo "OPENF1_USERNAME=${{ secrets.OPENF1_USERNAME }}" >> .env
          echo "OPENF1_PASSWORD=${{ secrets.OPENF1_PASSWORD }}" >> .env
          echo "REPLAY_SESSION_KEY=${{ vars.REPLAY_SESSION_KEY }}" >> .env
          echo "F1_LIVETIMING_TOKEN=${{ secrets.F1_LIVETIMING_TOKEN }}" >> .env
          echo "NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}" >> .env
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env
          echo "CONTACT_TO_EMAIL=${{ vars.CONTACT_TO_EMAIL }}" >> .env
          # NEXT_PUBLIC_PROXY_URL is intentionally NOT set: the browser uses the
          # same-origin /api/proxy rewrite so the proxy stays internal. Setting it
          # (especially to localhost) would bake a bad URL into every visitor's bundle.

      - name: Ensure docker network exists
        run: docker network create apps || true

      - name: Build and deploy
        run: |
          docker compose build
          docker compose up -d --remove-orphans
          docker image prune -f
